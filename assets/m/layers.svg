<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1006" viewBox="0 0 640 1006" role="img" aria-label="Four layers from physical asset to financial instrument"><style>.core{animation:core 3s ease-in-out infinite}@keyframes core{50%{stroke-opacity:.35}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1f"/><stop offset="1" stop-color="#0d1530"/></linearGradient></defs><rect width="640" height="1006" rx="20" fill="url(#bg)"/><text x="36" y="62" fill="#fff" font-size="31" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">From physical asset</text><text x="36" y="100" fill="#fff" font-size="31" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">to financial instrument</text><rect x="28" y="130" width="584" height="196" rx="16" fill="#0f2234" class="core" stroke="#22d3ee" stroke-opacity=".75" stroke-width="2"/><text x="52" y="186" fill="#22d3ee" font-size="38" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">01</text><rect x="411" y="154" width="177" height="38" rx="19" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-opacity=".7"/><text x="499.5" y="179" fill="#22d3ee" font-size="15" font-weight="800" letter-spacing="1.2" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">BUILT BY POWV</text><text x="52" y="234" fill="#fff" font-size="26" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Physical evidence</text><text x="52" y="268" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">What was observed, and can it be</text><text x="52" y="294" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">checked?</text><rect x="28" y="344" width="584" height="196" rx="16" fill="#0f2234" class="core" stroke="#22d3ee" stroke-opacity=".75" stroke-width="2"/><text x="52" y="400" fill="#22d3ee" font-size="38" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">02</text><rect x="411" y="368" width="177" height="38" rx="19" fill="#22d3ee" fill-opacity=".16" stroke="#22d3ee" stroke-opacity=".7"/><text x="499.5" y="393" fill="#22d3ee" font-size="15" font-weight="800" letter-spacing="1.2" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">BUILT BY POWV</text><text x="52" y="448" fill="#fff" font-size="26" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Operational trust</text><text x="52" y="482" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">May this actor act now, relying on this</text><text x="52" y="508" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">evidence?</text><rect x="28" y="558" width="584" height="196" rx="16" fill="#221d0e" stroke="#fbbf24" stroke-opacity=".75" stroke-width="2"/><text x="52" y="614" fill="#fbbf24" font-size="38" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">03</text><rect x="378" y="582" width="210" height="38" rx="19" fill="#fbbf24" fill-opacity=".16" stroke="#fbbf24" stroke-opacity=".7"/><text x="483.0" y="607" fill="#fbbf24" font-size="15" font-weight="800" letter-spacing="1.2" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">INFORMED BY POWV</text><text x="52" y="662" fill="#fff" font-size="26" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Institutional recognition</text><text x="52" y="696" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Does a valid asset or right exist that</text><text x="52" y="722" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">the institution accepts?</text><rect x="28" y="772" width="584" height="196" rx="16" fill="#0d1326" stroke="#94a3b8" stroke-opacity=".75" stroke-width="2" stroke-dasharray="8 7"/><text x="52" y="828" fill="#94a3b8" font-size="38" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">04</text><rect x="356" y="796" width="232" height="38" rx="19" fill="#94a3b8" fill-opacity=".16" stroke="#94a3b8" stroke-opacity=".7"/><text x="472.0" y="821" fill="#94a3b8" font-size="15" font-weight="800" letter-spacing="1.2" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">OPERATED BY OTHERS</text><text x="52" y="876" fill="#fff" font-size="26" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Tokenization · settlement</text><text x="52" y="910" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">How is the right represented, financed</text><text x="52" y="936" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">and transferred?</text></svg>