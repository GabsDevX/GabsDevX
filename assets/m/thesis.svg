<svg xmlns="http://www.w3.org/2000/svg" width="640" height="698" viewBox="0 0 640 698" role="img" aria-label="The RWA thesis"><rect width="640" height="698" rx="20" fill="#0b1124" stroke="#243047"/><rect x="20" y="24" width="600" height="196" rx="16" fill="#111a33" stroke="#22d3ee" stroke-opacity=".55"/><rect x="44" y="48" width="40" height="5" rx="2.5" fill="#22d3ee"/><text x="44" y="90" fill="#fff" font-size="27" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">The thesis</text><text x="44" y="128" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">A tokenized asset is only as credible as</text><text x="44" y="158" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">the evidence of its physical backing and</text><text x="44" y="188" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">the controls on who may act on it.</text><rect x="20" y="236" width="600" height="226" rx="16" fill="#111a33" stroke="#34d399" stroke-opacity=".55"/><rect x="44" y="260" width="40" height="5" rx="2.5" fill="#34d399"/><text x="44" y="302" fill="#fff" font-size="27" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">What PoWV builds</text><text x="44" y="340" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">The evidence layer and the</text><text x="44" y="370" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">operational-trust layer that RWA,</text><text x="44" y="400" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">trade-finance and settlement systems can</text><text x="44" y="430" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">rely on.</text><rect x="20" y="478" width="600" height="196" rx="16" fill="#111a33" stroke="#94a3b8" stroke-opacity=".55"/><rect x="44" y="502" width="40" height="5" rx="2.5" fill="#94a3b8"/><text x="44" y="544" fill="#fff" font-size="27" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">What PoWV does not do</text><text x="44" y="582" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">It does not issue tokens or operate</text><text x="44" y="612" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">custody, exchange or settlement. Those</text><text x="44" y="642" fill="#9fb0c6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">stay with regulated operators.</text></svg>