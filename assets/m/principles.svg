<svg xmlns="http://www.w3.org/2000/svg" width="640" height="816" viewBox="0 0 640 816" role="img" aria-label="How I work"><rect x="20" y="20" width="600" height="144" rx="16" fill="#111827" stroke="#243047"/><rect x="20" y="38" width="5" height="108" rx="2.5" fill="#22d3ee"/><text x="48" y="68" fill="#fff" font-size="25" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Evidence before claims</text><text x="592" y="66" fill="#6b7c96" font-size="18" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">01</text><text x="48" y="104" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Every public statement links to a dated</text><text x="48" y="132" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">record, with its limits.</text><rect x="20" y="178" width="600" height="144" rx="16" fill="#111827" stroke="#243047"/><rect x="20" y="196" width="5" height="108" rx="2.5" fill="#34d399"/><text x="48" y="226" fill="#fff" font-size="25" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Verified ≠ assumed</text><text x="592" y="224" fill="#6b7c96" font-size="18" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">02</text><text x="48" y="262" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Integrity, physical accuracy and key</text><text x="48" y="290" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">custody are reported separately.</text><rect x="20" y="336" width="600" height="144" rx="16" fill="#111827" stroke="#243047"/><rect x="20" y="354" width="5" height="108" rx="2.5" fill="#fbbf24"/><text x="48" y="384" fill="#fff" font-size="25" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Fail closed</text><text x="592" y="382" fill="#6b7c96" font-size="18" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">03</text><text x="48" y="420" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Inconsistent evidence is held for review,</text><text x="48" y="448" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">never silently accepted.</text><rect x="20" y="494" width="600" height="144" rx="16" fill="#111827" stroke="#243047"/><rect x="20" y="512" width="5" height="108" rx="2.5" fill="#22d3ee"/><text x="48" y="542" fill="#fff" font-size="25" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Reproducible</text><text x="592" y="540" fill="#6b7c96" font-size="18" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">04</text><text x="48" y="578" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Pinned dependencies, CI on every change,</text><text x="48" y="606" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">cross-implementation tests.</text><rect x="20" y="652" width="600" height="144" rx="16" fill="#111827" stroke="#243047"/><rect x="20" y="670" width="5" height="108" rx="2.5" fill="#f57c00"/><text x="48" y="700" fill="#fff" font-size="25" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">AI-assisted, human-directed</text><text x="592" y="698" fill="#6b7c96" font-size="18" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">05</text><text x="48" y="736" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">AI accelerates. Architecture, security and</text><text x="48" y="764" fill="#9fb0c6" font-size="20" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">acceptance stay human.</text></svg>