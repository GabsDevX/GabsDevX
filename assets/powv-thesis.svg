<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="The RWA thesis: what PoWV builds and what it does not do"><rect width="1200" height="330" rx="18" fill="#0b1124" stroke="#243047"/><rect x="40.0" y="30" width="360.0" height="270" rx="16" fill="#111a33" stroke="#22d3ee" stroke-opacity=".5"/><rect x="66.0" y="56" width="36" height="5" rx="2.5" fill="#22d3ee"/><text x="66.0" y="100" fill="#fff" font-size="27" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">The thesis</text><text x="66.0" y="142" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">A tokenized asset is only as</text><text x="66.0" y="172" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">credible as the evidence of</text><text x="66.0" y="202" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">its physical backing and the</text><text x="66.0" y="232" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">controls on who may act on</text><text x="66.0" y="262" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">it.</text><rect x="420.0" y="30" width="360.0" height="270" rx="16" fill="#111a33" stroke="#34d399" stroke-opacity=".5"/><rect x="446.0" y="56" width="36" height="5" rx="2.5" fill="#34d399"/><text x="446.0" y="100" fill="#fff" font-size="27" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">What PoWV builds</text><text x="446.0" y="142" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">The evidence layer and the</text><text x="446.0" y="172" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">operational-trust layer that</text><text x="446.0" y="202" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">RWA, trade-finance and</text><text x="446.0" y="232" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">settlement systems can rely</text><text x="446.0" y="262" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">on.</text><rect x="800.0" y="30" width="360.0" height="270" rx="16" fill="#111a33" stroke="#94a3b8" stroke-opacity=".5"/><rect x="826.0" y="56" width="36" height="5" rx="2.5" fill="#94a3b8"/><text x="826.0" y="100" fill="#fff" font-size="27" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">What PoWV does not do</text><text x="826.0" y="142" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">It does not issue tokens or</text><text x="826.0" y="172" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">operate custody, exchange or</text><text x="826.0" y="202" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">settlement. Those stay with</text><text x="826.0" y="232" fill="#b4c2d6" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">regulated operators.</text></svg>