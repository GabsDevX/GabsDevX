<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Four layers from physical asset to financial instrument: physical evidence and operational trust are built by PoWV; institutional recognition is informed by PoWV evidence; tokenization, financing and settlement are operated by others"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1f"/><stop offset="1" stop-color="#0d1530"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".04"/></linearGradient><linearGradient id="inf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24" stop-opacity=".12"/><stop offset="1" stop-color="#fbbf24" stop-opacity=".02"/></linearGradient><style>.flow{stroke-dasharray:4 7;animation:f 1.2s linear infinite}@keyframes f{to{stroke-dashoffset:-11}}</style></defs><rect width="1200" height="640" rx="18" fill="url(#bg)" stroke="#243047"/><text x="48" y="58" fill="#fff" font-size="26" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">From physical asset to financial instrument</text><text x="48" y="88" fill="#8a9bb3" font-size="15" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Four layers, four different questions. A yes in one layer is never assumed in the next.</text><rect x="150" y="122" width="1002" height="104" rx="14" fill="url(#core)" stroke="#22d3ee" stroke-opacity=".85" stroke-width="1.5"/><rect x="150" y="138" width="4" height="72" rx="2" fill="#22d3ee"/><text x="184" y="184" fill="#22d3ee" font-size="34" font-weight="800" fill-opacity="1" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">01</text><text x="254" y="166" fill="#fff" font-size="21" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Physical evidence</text><text x="254" y="194" fill="#8a9bb3" font-size="14.5" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">What was observed about the asset or event, and can that evidence be checked?</text><rect x="986.2" y="144" width="141.8" height="28" rx="14" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity=".6"/><text x="1057.1000000000001" y="163" fill="#22d3ee" font-size="12" font-weight="800" letter-spacing="1.2" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">BUILT BY POWV</text><text x="1128" y="198" fill="#c9d4e3" font-size="13" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Secure Capture Node · Protocol Suite</text><line class="flow" x1="202" y1="228" x2="202" y2="248" stroke="#22d3ee" stroke-width="2"/><rect x="150" y="250" width="1002" height="104" rx="14" fill="url(#core)" stroke="#22d3ee" stroke-opacity=".85" stroke-width="1.5"/><rect x="150" y="266" width="4" height="72" rx="2" fill="#22d3ee"/><text x="184" y="312" fill="#22d3ee" font-size="34" font-weight="800" fill-opacity="1" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">02</text><text x="254" y="294" fill="#fff" font-size="21" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Operational trust</text><text x="254" y="322" fill="#8a9bb3" font-size="14.5" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">May this actor take this action now, relying on this evidence?</text><rect x="986.2" y="272" width="141.8" height="28" rx="14" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity=".6"/><text x="1057.1000000000001" y="291" fill="#22d3ee" font-size="12" font-weight="800" letter-spacing="1.2" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">BUILT BY POWV</text><text x="1128" y="326" fill="#c9d4e3" font-size="13" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">EdgeGuard · Digital Treasury profile</text><line class="flow" x1="202" y1="356" x2="202" y2="376" stroke="#22d3ee" stroke-width="2"/><rect x="150" y="378" width="1002" height="104" rx="14" fill="url(#inf)" stroke="#fbbf24" stroke-opacity=".85" stroke-width="1.5"/><text x="184" y="440" fill="#fbbf24" font-size="34" font-weight="800" fill-opacity="1" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">03</text><text x="254" y="422" fill="#fff" font-size="21" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Institutional recognition</text><text x="254" y="450" fill="#8a9bb3" font-size="14.5" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Does an economically valid asset or right exist that the institution accepts?</text><rect x="960.4" y="400" width="167.6" height="28" rx="14" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity=".6"/><text x="1044.2" y="419" fill="#fbbf24" font-size="12" font-weight="800" letter-spacing="1.2" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">INFORMED BY POWV</text><text x="1128" y="454" fill="#c9d4e3" font-size="13" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">The institution decides; PoWV evidence informs</text><line class="flow" x1="202" y1="484" x2="202" y2="504" stroke="#fbbf24" stroke-width="2"/><rect x="150" y="506" width="1002" height="104" rx="14" fill="#0d1326" stroke="#94a3b8" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="7 6"/><text x="184" y="568" fill="#94a3b8" font-size="34" font-weight="800" fill-opacity="0.7" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">04</text><text x="254" y="550" fill="#fff" font-size="21" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Tokenization · financing · settlement</text><text x="254" y="578" fill="#8a9bb3" font-size="14.5" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">How is the recognized right represented, financed, held and transferred?</text><rect x="943.2" y="528" width="184.79999999999998" height="28" rx="14" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity=".6"/><text x="1035.6000000000001" y="547" fill="#94a3b8" font-size="12" font-weight="800" letter-spacing="1.2" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">OPERATED BY OTHERS</text><text x="1128" y="582" fill="#c9d4e3" font-size="13" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Issuers, financiers, custodians, settlement systems</text><path d="M 126 130 H 112 V 346 H 126" fill="none" stroke="#22d3ee" stroke-width="2"/><text transform="translate(98,238.0) rotate(-90)" fill="#22d3ee" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">POWV CORE</text><path d="M 126 386 H 112 V 474 H 126" fill="none" stroke="#fbbf24" stroke-width="2"/><text transform="translate(98,430.0) rotate(-90)" fill="#fbbf24" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">INFORMS</text><path d="M 126 514 H 112 V 602 H 126" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><text transform="translate(98,558.0) rotate(-90)" fill="#94a3b8" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">DOWNSTREAM</text></svg>