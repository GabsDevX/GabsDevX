nt-size="14" font-weight="600" text-anchor="middle">Nov 2026</text><text x="906.0" y="158" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Engineering hardening</text><text x="906.0" y="180" fill="#8a9bb3" font-size="13" text-anchor="middle">343 tests · CI</text><circle cx="1110.0" cy="120" r="9" fill="#0a0e1f" stroke="#f57c00" stroke-width="3"/><circle cx="1110.0" cy="120" r="4" fill="#f57c00"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="1110.0" y="88" fill="#f57c00" font-size="14" font-weight="600" text-anchor="middle">Next</text><text x="1110.0" y="158" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Signed bench test</text><text x="1110.0" y="180" fill="#8a9bb3" font-size="13" text-anchor="middle">then secure element, pilot</text></g></svg>