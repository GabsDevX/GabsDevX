<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="How I work: evidence before claims; verified is not assumed; fail closed; reproducible; AI-assisted, human-directed"><rect x="0.0" y="0" width="227.2" height="230" rx="16" fill="#111827" stroke="#243047"/><rect x="20.0" y="20" width="44" height="44" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".55"/><text x="42.0" y="50" fill="#22d3ee" font-size="20" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">◎</text><text x="207.2" y="48" fill="#5f708a" font-size="14" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">01</text><text x="20.0" y="96" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Evidence before</text><text x="20.0" y="118" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">claims</text><text x="20.0" y="146" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Every public statement links</text><text x="20.0" y="165" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">to a dated record, with its</text><text x="20.0" y="184" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">limits next to the result.</text><rect x="243.2" y="0" width="227.2" height="230" rx="16" fill="#111827" stroke="#243047"/><rect x="263.2" y="20" width="44" height="44" rx="12" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text x="285.2" y="50" fill="#34d399" font-size="20" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">⚖</text><text x="450.4" y="48" fill="#5f708a" font-size="14" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">02</text><text x="263.2" y="96" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Verified ≠ assumed</text><text x="263.2" y="124" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Integrity, physical accuracy</text><text x="263.2" y="143" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">and key custody are reported</text><text x="263.2" y="162" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">as three separate things.</text><rect x="486.4" y="0" width="227.2" height="230" rx="16" fill="#111827" stroke="#243047"/><rect x="506.4" y="20" width="44" height="44" rx="12" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".55"/><text x="528.4" y="50" fill="#fbbf24" font-size="20" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">⛨</text><text x="693.5999999999999" y="48" fill="#5f708a" font-size="14" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">03</text><text x="506.4" y="96" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Fail closed</text><text x="506.4" y="124" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Inconsistent or incomplete</text><text x="506.4" y="143" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">evidence is held for review,</text><text x="506.4" y="162" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">never silently accepted.</text><rect x="729.5999999999999" y="0" width="227.2" height="230" rx="16" fill="#111827" stroke="#243047"/><rect x="749.5999999999999" y="20" width="44" height="44" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".55"/><text x="771.5999999999999" y="50" fill="#22d3ee" font-size="20" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">↻</text><text x="936.8" y="48" fill="#5f708a" font-size="14" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">04</text><text x="749.5999999999999" y="96" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Reproducible</text><text x="749.5999999999999" y="124" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Pinned dependencies, CI on</text><text x="749.5999999999999" y="143" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">every change, conformance a</text><text x="749.5999999999999" y="162" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">second implementation must</text><text x="749.5999999999999" y="181" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">pass.</text><rect x="972.8" y="0" width="227.2" height="230" rx="16" fill="#111827" stroke="#243047"/><rect x="992.8" y="20" width="44" height="44" rx="12" fill="#f57c00" fill-opacity=".14" stroke="#f57c00" stroke-opacity=".55"/><text x="1014.8" y="50" fill="#f57c00" font-size="20" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">✦</text><text x="1180.0" y="48" fill="#5f708a" font-size="14" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">05</text><text x="992.8" y="96" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">AI-assisted,</text><text x="992.8" y="118" fill="#fff" font-size="17" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">human-directed</text><text x="992.8" y="146" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">AI tools accelerate.</text><text x="992.8" y="165" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Architecture, security,</text><text x="992.8" y="184" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">review and acceptance stay</text><text x="992.8" y="203" fill="#8a9bb3" font-size="13" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">human.</text></svg>