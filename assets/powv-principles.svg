<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="How I work: evidence before claims; verified is not assumed; fail closed; reproducible; AI-assisted, human-directed"><rect x="0.0" y="0" width="386.6666666666667" height="270" rx="18" fill="#111827" stroke="#243047"/><rect x="26.0" y="26" width="56" height="56" rx="14" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee" stroke-opacity=".6"/><text x="54.0" y="64" fill="#22d3ee" font-size="26" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">◎</text><text x="360.6666666666667" y="60" fill="#6b7c96" font-size="20" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">01</text><text x="26.0" y="126" fill="#fff" font-size="28" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Evidence before claims</text><text x="26.0" y="166" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Every public statement links to</text><text x="26.0" y="196" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">a dated record, with its limits</text><text x="26.0" y="226" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">next to the result.</text><rect x="406.6666666666667" y="0" width="386.6666666666667" height="270" rx="18" fill="#111827" stroke="#243047"/><rect x="432.6666666666667" y="26" width="56" height="56" rx="14" fill="#34d399" fill-opacity=".15" stroke="#34d399" stroke-opacity=".6"/><text x="460.6666666666667" y="64" fill="#34d399" font-size="26" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">⚖</text><text x="767.3333333333334" y="60" fill="#6b7c96" font-size="20" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">02</text><text x="432.6666666666667" y="126" fill="#fff" font-size="28" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Verified ≠ assumed</text><text x="432.6666666666667" y="166" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Integrity, physical accuracy and</text><text x="432.6666666666667" y="196" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">key custody are reported as</text><text x="432.6666666666667" y="226" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">three separate things.</text><rect x="813.3333333333334" y="0" width="386.6666666666667" height="270" rx="18" fill="#111827" stroke="#243047"/><rect x="839.3333333333334" y="26" width="56" height="56" rx="14" fill="#fbbf24" fill-opacity=".15" stroke="#fbbf24" stroke-opacity=".6"/><text x="867.3333333333334" y="64" fill="#fbbf24" font-size="26" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">⛨</text><text x="1174.0" y="60" fill="#6b7c96" font-size="20" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">03</text><text x="839.3333333333334" y="126" fill="#fff" font-size="28" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Fail closed</text><text x="839.3333333333334" y="166" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Inconsistent or incomplete</text><text x="839.3333333333334" y="196" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">evidence is held for review,</text><text x="839.3333333333334" y="226" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">never silently accepted.</text><rect x="0.0" y="290" width="590.0" height="230" rx="18" fill="#111827" stroke="#243047"/><rect x="26.0" y="316" width="56" height="56" rx="14" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee" stroke-opacity=".6"/><text x="54.0" y="354" fill="#22d3ee" font-size="26" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">↻</text><text x="564.0" y="350" fill="#6b7c96" font-size="20" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">04</text><text x="26.0" y="416" fill="#fff" font-size="28" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Reproducible</text><text x="26.0" y="456" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">Pinned dependencies, CI on every change, and</text><text x="26.0" y="486" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">conformance a second implementation must pass.</text><rect x="610.0" y="290" width="590.0" height="230" rx="18" fill="#111827" stroke="#243047"/><rect x="636.0" y="316" width="56" height="56" rx="14" fill="#f57c00" fill-opacity=".15" stroke="#f57c00" stroke-opacity=".6"/><text x="664.0" y="354" fill="#f57c00" font-size="26" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">✦</text><text x="1174.0" y="350" fill="#6b7c96" font-size="20" text-anchor="end" font-family="Consolas,'SFMono-Regular',Menlo,'Liberation Mono',monospace">05</text><text x="636.0" y="416" fill="#fff" font-size="28" font-weight="800" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">AI-assisted, human-directed</text><text x="636.0" y="456" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">AI tools accelerate the work. Architecture,</text><text x="636.0" y="486" fill="#aab8cc" font-size="21" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">security, review and acceptance stay human.</text></svg>