name: Generate activity panel

on:
  schedule:
    - cron: "41 7,19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Render activity panel
        run: python .github/scripts/activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY_USER: GabsDevX
          ACTIVITY_OUT: dist/activity.svg

      - name: Publish panel
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: activity
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
